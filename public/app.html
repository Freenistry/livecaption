<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&display=swap">
<style>
  :root {
    --bg: #f7f6f3; --fg: #1d1d1b; --muted: #8a8780; --line: #e3e1dc; --soft: #efede8; --accent: #1d1d1b; --on-accent: #f7f6f3;
    --err: #a3392b;
    color-scheme: light; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecebe7; --muted: #8d8a83; --line: #2c2b29; --soft: #222120; --accent: #ecebe7; --on-accent: #161615; --err: #e0806f; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; justify-content: center;
    /* crisp text: grayscale AA on macOS (subpixel AA makes light-on-dark text look bold and fuzzy), kerning + Inter's
       contextual alternates, and legibility-tuned rendering. Windows ignores the smoothing props and uses ClearType. */
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
    font-kerning: normal; font-feature-settings: "kern", "calt"; font-optical-sizing: auto; }
  main { width: 100%; max-width: 680px; padding: 72px 16px 48px; text-align: center; }
  h1 { font-weight: 500; font-size: 1.05rem; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 56px; }
  .label { display: block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .field { margin: 0 0 40px; }
  select { font: inherit; font-size: 1rem; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: 6px 24px 6px 4px; text-align: center; text-align-last: center; cursor: pointer; }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip { font: inherit; font-size: .9rem; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; cursor: pointer; transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 12px; min-height: 1.2em; }
  #go { font: inherit; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--on-accent); background: var(--accent);
    border: 0; border-radius: 999px; padding: 14px 40px; cursor: pointer; }
  #go:disabled { opacity: .35; cursor: not-allowed; }
  #go.on { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  #err { color: var(--err); font-size: .85rem; min-height: 1.3em; margin: 20px 0 0; }
  #status { font-size: .75rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  #status::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); margin-right: 8px; vertical-align: 1px; }
  #status.live::before { background: #4f8a5b; }
  #out { margin-top: 56px; text-align: center; }
  #src { font-size: .9rem; color: var(--muted); min-height: 1.4em; margin: 0 0 40px; line-height: 1.5; }
  .lane { border-top: 1px solid var(--line); padding: 28px 0; }
  .lane .label { margin-bottom: 14px; }
  .past { font-size: 1.05rem; line-height: 1.55; color: var(--muted); }
  .past p, .now { margin: 0 0 8px; }
  .now { font-size: 1.45rem; line-height: 1.5; min-height: 1.5em; }
  .now.partial { color: var(--muted); }
  .now { transition: color 200ms ease; }
  @media (prefers-reduced-motion: reduce) { .chip, .now { transition: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Live Translate</h1>

  <section id="setup">
    <div class="field">
      <label class="label" for="from">I speak</label>
      <select id="from"></select>
    </div>
    <div class="field">
      <span class="label" id="to-label">Translate into</span>
      <div class="chips" id="to" role="group" aria-labelledby="to-label"></div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <button id="go" disabled>Start</button>
  <div id="err" role="alert"></div>
  <div id="status">idle</div>

  <section id="out" hidden aria-live="polite">
    <p id="src" dir="auto"></p>
    <div id="lanes"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const qsToken = new URLSearchParams(location.search).get('token');
if (qsToken) store.set('appToken', qsToken);
const token = qsToken || store.get('appToken', '');
let L = { spoken: [], targets: [], maxTargets: 4 }, picked = new Set(store.get('to', ['zh-Hans']));
const name = (code) => (L.targets.find((t) => t.code === code) || L.spoken.find((s) => s.code === code) || { name: code }).name;

function renderChips() {
  const from = $('from').value;
  for (const c of [...picked]) if (c === from || !L.targets.find((t) => t.code === c && t.ready)) picked.delete(c);
  $('to').innerHTML = '';
  for (const t of L.targets) {
    if (t.code === from) continue;
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = t.name; b.type = 'button';
    b.setAttribute('aria-pressed', picked.has(t.code));
    b.disabled = !t.ready || (!picked.has(t.code) && picked.size >= L.maxTargets);
    if (!t.ready) b.title = 'model not installed';
    b.onclick = () => { picked.has(t.code) ? picked.delete(t.code) : picked.add(t.code); store.set('to', [...picked]); renderChips(); };
    $('to').append(b);
  }
  $('hint').textContent = picked.size >= L.maxTargets ? `Up to ${L.maxTargets} languages at once` : '';
  $('go').disabled = !picked.size;
}

fetch('/api/languages').then((r) => r.json()).then((j) => {
  L = j;
  for (const s of L.spoken) { const o = new Option(s.ready ? s.name : `${s.name} (not installed)`, s.code); o.disabled = !s.ready; $('from').add(o); }
  const saved = store.get('from', 'en');
  $('from').value = L.spoken.find((s) => s.code === saved && s.ready) ? saved : 'en';
  $('from').onchange = () => { store.set('from', $('from').value); renderChips(); };
  renderChips();
}).catch(() => { $('err').textContent = 'Server not reachable. Is it running? (.\\serve.ps1)'; });

// --- captions ---
const lanes = {}; // code -> { past, now }
function buildLanes(to) {
  $('lanes').innerHTML = ''; $('src').textContent = '';
  for (const t of to) {
    const d = document.createElement('div'); d.className = 'lane';
    d.innerHTML = `<span class="label">${name(t)}</span><div class="past" dir="auto"></div><p class="now" dir="auto"></p>`;
    $('lanes').append(d); lanes[t] = { past: d.querySelector('.past'), now: d.querySelector('.now'), seg: -1 };
  }
}
function onMsg(m) {
  if (m.type === 'status') { if (m.level === 'error') $('err').textContent = m.msg; return; }
  if (m.type === 'src_partial' || m.type === 'endpoint') { $('src').textContent = m.src; return; }
  const l = lanes[m.to]; if (!l) return;
  if (m.seg > l.seg) { // new segment: push the previous line up
    if (l.now.textContent) { const p = document.createElement('p'); p.textContent = l.now.textContent; l.past.append(p); while (l.past.children.length > 2) l.past.firstChild.remove(); }
    l.seg = m.seg; l.now.textContent = ''; l.now.classList.add('partial'); l.final = false;
  }
  if (m.seg < l.seg) { // a late final for the previous line: fix it in place
    if (m.type === 'final' && l.past.lastChild) l.past.lastChild.textContent = m.text;
    return;
  }
  if (m.type === 'tr_partial' && !l.final) l.now.textContent = m.text;
  if (m.type === 'final') { l.final = true; l.now.textContent = m.text; l.now.classList.remove('partial'); }
}

// --- audio: native rate -> 16 kHz mono PCM16, 80 ms frames ---
const worklet = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; this.out = new Int16Array(1280); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const a = Math.floor(this.pos), b = Math.min(ch.length, Math.max(a + 1, Math.floor(this.pos + this.ratio)));
      let s = 0; for (let i = a; i < b; i++) s += ch[i];
      this.out[this.n++] = Math.max(-1, Math.min(1, s / (b - a))) * 32767;
      if (this.n === this.out.length) { this.port.postMessage(this.out.buffer, [this.out.buffer]); this.out = new Int16Array(1280); this.n = 0; }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor('pcm16', Pcm16);`;

let ctx, stream, ws;
async function start() {
  const to = [...picked];
  buildLanes(to);
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live?token=${encodeURIComponent(token)}&lang=${$('from').value}&to=${to.join(',')}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => { try { onMsg(JSON.parse(e.data)); } catch {} };
  ws.onclose = (e) => { if (ctx) ui(false); setStatus(false, e.code === 1006 && !token ? 'closed (token needed? add ?token=…)' : 'idle'); };
  await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error('could not connect to the server')); });
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(ctx, 'pcm16');
  node.port.onmessage = (e) => { if (ws?.readyState === 1) ws.send(e.data); };
  ctx.createMediaStreamSource(stream).connect(node);
  setStatus(true, 'listening');
}
function stop() {
  if (ws?.readyState === 1) ws.send('flush');
  stream?.getTracks().forEach((t) => t.stop()); ctx?.close();
  const w = ws; setTimeout(() => w?.close(), 3000); // let the last final arrive
  ctx = stream = ws = null;
}
const setStatus = (live, msg) => { $('status').className = live ? 'live' : ''; $('status').textContent = msg; };
function ui(running) {
  $('setup').hidden = running; $('out').hidden = !running && !$('lanes').children.length;
  $('go').textContent = running ? 'Stop' : 'Start'; $('go').classList.toggle('on', running);
  if (!running) { stop(); setStatus(false, 'idle'); }
}
$('go').onclick = async () => {
  if (ctx || ws) return ui(false);
  $('err').textContent = '';
  try { ui(true); await start(); }
  catch (e) { ui(false); $('err').textContent = e.message; }
};
</script>
</body>
</html>
