<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Captions</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #111; color: #eee; padding: 16px; max-width: 900px; margin-inline: auto; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: 8px 18px; border-radius: 6px; border: 0; background: #2d6cdf; color: #fff; cursor: pointer; }
  button.on { background: #c33; }
  #conn::before { content: "●"; margin-right: 4px; }
  #conn.ok { color: #4c4; } #conn.bad { color: #c44; }
  #err { color: #f77; min-height: 1.4em; margin: 8px 0; }
  .cap { border-bottom: 1px solid #333; padding: 10px 0; }
  .dst { font-size: 1.6rem; line-height: 1.35; }
  .src { font-size: .9rem; color: #999; margin-top: 4px; }
  .lat { font-size: .75rem; color: #6a6; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 200ms ease; }
  .cap.done .lat { opacity: 1; }
  /* word reveal: space is reserved up front, so no reflow while words land */
  .dst .w { display: inline-block; opacity: 0; transform: translateY(0.18em);
            transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1),
                        transform 180ms cubic-bezier(0.23, 1, 0.32, 1); }
  .dst.in .w { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .dst .w { transform: none; transition: opacity 120ms ease; }
    .lat { transition: opacity 120ms ease; }
  }
</style>
</head>
<body>
<header>
  <button id="btn">Start mic</button>
  <span id="conn" class="bad">checking…</span>
</header>
<div id="err" role="alert"></div>
<main id="caps" aria-live="polite"></main>
<script src="vad.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let ctx, stream, node, vad;
// token: pass ?token=... once; remembered in this browser
const qs = new URLSearchParams(location.search).get('token');
let token = qs || '';
try { if (qs) localStorage.setItem('appToken', qs); else token = localStorage.getItem('appToken') || ''; } catch {}

function status(ok, msg) { $('conn').className = ok ? 'ok' : 'bad'; $('conn').textContent = msg; }

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
const wordCount = (s) => (s || '').split(/\s+/).filter(Boolean).length;

// Split into words, each wrapped in its own span, animated in on a stagger.
// Words occupy their space immediately, so the line never reflows under the reader.
function fillWords(el, text, staggerMs) {
  el.textContent = '';
  let i = 0;
  for (const part of (text || '').split(/(\s+)/)) {
    if (!part) continue;
    if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(part)); continue; }
    const s = document.createElement('span');
    s.className = 'w';
    s.textContent = part;
    if (!reduceMotion && staggerMs) s.style.transitionDelay = `${Math.round(i * staggerMs)}ms`;
    el.appendChild(s);
    i++;
  }
  return i;
}

function show(m) {
  const caps = $('caps');
  const existing = [...caps.children];
  const before = existing.map((el) => el.getBoundingClientRect().top);

  const d = document.createElement('div');
  d.className = 'cap';
  d.innerHTML = '<div class="dst"></div><div class="src"></div><div class="lat"></div>';
  d.children[1].textContent = m.src;
  d.children[2].textContent = `ASR ${m.asrMs} ms · MT ${m.mtMs} ms · total ${m.totalMs} ms · round trip ${m.rttMs} ms`;

  // pace the reveal against how long the speaker actually talked
  const n = wordCount(m.dst);
  const stagger = clamp(70, (m.audioMs || 1200) / Math.max(1, n), 170);
  const words = fillWords(d.children[0], m.dst, stagger);
  caps.prepend(d);

  if (!reduceMotion) {
    // FLIP: let the older captions slide to their new positions instead of jumping
    existing.forEach((el, i) => {
      const dy = before[i] - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 0.5) {
        el.animate(
          [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
          { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
        );
      }
    });
    requestAnimationFrame(() => requestAnimationFrame(() => d.children[0].classList.add('in')));
  } else {
    d.children[0].classList.add('in');
  }

  const revealMs = reduceMotion ? 150 : Math.max(0, (words - 1) * stagger) + 180;
  setTimeout(() => d.classList.add('done'), revealMs + 80);

  while (caps.children.length > 6) caps.lastChild.remove();
}

// ponytail: 1 request in flight + 1-slot backlog; a newer segment replaces an unsent one (drop backlog, never drift)
let busy = false, pending = null;
async function send(pcm) {
  if (busy) { if (pending) $('err').textContent = 'dropped a segment (falling behind)'; pending = pcm; return; }
  busy = true;
  const t0 = performance.now();
  try {
    const r = await fetch('/api/segment', { method: 'POST', headers: { 'content-type': 'audio/wav', 'x-app-token': token }, body: Vad.toWav(pcm) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error('Unauthorized: open this page with ?token=YOUR_APP_TOKEN');
    if (!r.ok) throw new Error(`/api/segment failed (HTTP ${r.status}): ${j.error || r.statusText}`);
    status(true, 'ok');
    $('err').textContent = '';
    if (j.src) show({ ...j, rttMs: Math.round(performance.now() - t0) });
  } catch (e) {
    status(false, 'error');
    $('err').textContent = e.message;
  }
  busy = false;
  if (pending) { const p = pending; pending = null; send(p); }
}

// AudioWorklet: downsample native rate -> 16 kHz mono Int16, post ~100 ms frames.
const worklet = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0; this.out = new Int16Array(1600); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    // box-filter decimation: average source samples falling into each output sample
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const a = Math.floor(this.pos), b = Math.min(ch.length, Math.max(a + 1, Math.floor(this.pos + this.ratio)));
      let s = 0; for (let i = a; i < b; i++) s += ch[i];
      const v = Math.max(-1, Math.min(1, s / (b - a)));
      this.out[this.n++] = v * 32767;
      if (this.n === this.out.length) { this.port.postMessage(this.out.buffer, [this.out.buffer]); this.out = new Int16Array(1600); this.n = 0; }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor('pcm16', Pcm16);`;

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'text/javascript' })));
  node = new AudioWorkletNode(ctx, 'pcm16');
  vad = Vad.createVad(send);
  node.port.onmessage = (e) => vad.push(new Int16Array(e.data));
  ctx.createMediaStreamSource(stream).connect(node);
}

function stop() {
  vad?.flush(); vad = null;
  stream?.getTracks().forEach((t) => t.stop());
  ctx?.close();
  ctx = stream = node = null;
}

$('btn').onclick = async () => {
  if (ctx) { stop(); $('btn').textContent = 'Start mic'; $('btn').classList.remove('on'); return; }
  try {
    await start();
    $('btn').textContent = 'Stop mic'; $('btn').classList.add('on'); $('err').textContent = '';
  } catch (e) { stop(); $('err').textContent = `Mic error: ${e.message}`; }
};
fetch('/api/health').then((r) => r.json()).then((h) => status(h.ok, `${h.backend} → ${h.target}`)).catch(() => status(false, 'health check failed'));
</script>
</body>
</html>
